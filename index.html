<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/frugallm-icon.png" />
    <link rel="apple-touch-icon" href="/frugallm-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrugaLLM</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('frugallm-theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'dark';
          var root = document.documentElement;
          root.classList.add(theme);
          root.classList.add(theme === 'dark' ? 'theme-ebony' : 'theme-linen');
          root.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
