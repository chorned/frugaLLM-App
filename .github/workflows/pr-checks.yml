name: PR Gatekeeper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Run Test Pyramid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bce96c5465dc8ee9832be0b2 # v4.2.0
        with:
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3f241a457478e5814da570231a3745f14b624404 # stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      # CRITICAL: Cargo test requires Tauri's C-bindings on Linux
      - name: Install Ubuntu Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        run: npm install

      # 1. FRONTEND TESTS
      - name: Run React/Vite Tests
        run: npx vitest run

      # 2. BACKEND TESTS
      - name: Run Rust Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 3. E2E TESTS
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba841f # v4.6.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
