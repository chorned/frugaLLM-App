name: PR Gatekeeper
run-name: "Gatekeeper: ${{ github.event.pull_request.title || github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Run Test Pyramid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # CRITICAL: Cargo test requires Tauri's C-bindings on Linux
      - name: Install Ubuntu Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        run: npm install

      # 1. TYPECHECK & LINT CHECKS
      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Rust Clippy Linters
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # 2. FRONTEND TESTS
      - name: Run React/Vite Tests
        run: npx vitest run

      # 3. BACKEND TESTS
      - name: Run Rust Tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FRUGAL_OFFLINE_BUILD: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 4. E2E TESTS
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5. RUN PLAYWRIGHT
      - name: Run Playwright E2E
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
