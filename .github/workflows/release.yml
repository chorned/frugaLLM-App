name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-13, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'FrugaLLM v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false

      - name: Install tauri-driver
        if: matrix.platform != 'macos-13'
        run: cargo install tauri-driver --locked

      - name: Install Linux WebDriver dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get install -y webkit2gtk-driver

      - name: Run release smoke test (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: xvfb-run npx wdio run smoke-tests/wdio.conf.js

      - name: Run release smoke test (Windows)
        if: matrix.platform == 'windows-latest'
        run: npx wdio run smoke-tests/wdio.conf.js