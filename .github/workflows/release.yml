name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Universal Rust Targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'FrugaLLM v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

      - name: Install tauri-driver
        if: matrix.platform != 'macos-latest'
        run: cargo install tauri-driver --locked

      - name: Install Linux WebDriver dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get install -y webkit2gtk-driver

      - name: Run release smoke test (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: xvfb-run npx wdio run smoke-tests/wdio.conf.js

      - name: Configure Windows WebDriver & WebView2 Policy
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          try {
            node -e "import('edgedriver').then(m => m.download()).then(p => { const fs = require('fs'); const path = require('path'); const dest = path.join(process.env.USERPROFILE, '.cargo', 'bin', 'msedgedriver.exe'); fs.copyFileSync(p, dest); console.log('Copied msedgedriver to ' + dest); }).catch(e => console.warn(e))"
          } catch {
            Write-Host "Node edgedriver notice: $_"
          }
          
          $regPaths = @(
            "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments",
            "HKCU:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          )
          foreach ($p in $regPaths) {
            New-Item -Path $p -Force | Out-Null
            Set-ItemProperty -Path $p -Name "*" -Value "--remote-debugging-port=0 --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-allow-origins=*"
            Set-ItemProperty -Path $p -Name "frugallm-app.exe" -Value "--remote-debugging-port=0 --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-allow-origins=*"
          }

      - name: Run release smoke test (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: '--remote-debugging-port=0 --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-allow-origins=*'
        run: npx wdio run smoke-tests/wdio.conf.js