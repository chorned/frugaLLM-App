name: Release
run-name: "Release ${{ github.ref_name }}: ${{ github.event.head_commit.message || 'Manual Trigger' }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Install macOS Universal Rust Targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Decode App Store Connect API Key
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Build and draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ENABLE_CODE_SIGNING: true
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Carl Horned (PG6G5TQVQQ)"
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_KEY_PATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        with:
          tagName: v__VERSION__
          releaseName: 'FrugaLLM v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: |
            src-tauri/target/**/bundle/*/*.*
            src-tauri/target/**/bundle/*/*

      - name: Install tauri-driver
        if: matrix.platform != 'macos-latest'
        run: cargo install tauri-driver --locked

      - name: Install Linux WebDriver dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get install -y webkit2gtk-driver

      - name: Run release smoke test (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: xvfb-run npx wdio run smoke-tests/wdio.conf.js

      - name: Configure Windows WebDriver & WebView2 Policy
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          try {
            node -e "import('edgedriver').then(m => m.download()).then(p => { const fs = require('fs'); const path = require('path'); const dest = path.join(process.env.USERPROFILE, '.cargo', 'bin', 'msedgedriver.exe'); fs.copyFileSync(p, dest); console.log('Copied msedgedriver to ' + dest); }).catch(e => console.warn(e))"
          } catch {
            Write-Host "Node edgedriver notice: $_"
          }
          
          $regPaths = @(
            "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments",
            "HKCU:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          )
          foreach ($p in $regPaths) {
            New-Item -Path $p -Force | Out-Null
            Set-ItemProperty -Path $p -Name "*" -Value "--remote-debugging-port=0 --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-allow-origins=*"
            Set-ItemProperty -Path $p -Name "frugallm-app.exe" -Value "--remote-debugging-port=0 --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-allow-origins=*"
          }

      - name: Run release smoke test (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: '--remote-debugging-port=0 --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-allow-origins=*'
        run: npx wdio run smoke-tests/wdio.conf.js